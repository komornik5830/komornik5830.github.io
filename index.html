<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Token Clicker</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    margin-top: 50px;
    position: relative;
}

/* POSTAC */
#postac {
    font-family: monospace;
    font-size: 20px;
    cursor: pointer;
    white-space: pre;
    margin-bottom: 20px;
    user-select: none;
    height: 400px;
    color: black;
}

/* TEKSTY */
#punkty, #poziom {
    font-size: 30px;
    margin-top: 20px;
}

/* BUTTONY */
button {
    font-size: 20px;
    margin: 10px;
    cursor: pointer;
}

/* EFEKT */
.punktEfekt {
    position: absolute;
    font-size: 35px;
    font-weight: bold;
    color: rgb(255, 0, 21);
    pointer-events: none;
    transition: transform 1s ease-out, opacity 1s ease-out;
}

/* PANEL INVENTORY */
#inventoryPanel {
    position: fixed;
    right: 20px;
    top: 100px;
    width: 260px;
    background: white;
    border: 2px solid black;
    border-radius: 10px;
    padding: 10px;
}

#inventory {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
</style>

</head>
<body>

<div id="postac"></div>

<div id="punkty">Punkty: 0</div>
<div id="poziom">Poziom kota: 1 (0/2 kliknięć)</div>

<!-- UPGRADEY (DYNAMICZNE) -->
<div>
    <h2>Upgrade</h2>
    <div id="upgrades"></div>
</div>

<!-- SKRÓTY (opcjonalne - możesz usunąć gdy w pełni dynamiczne) -->


<div>
    <h2>Sklep skinów</h2>
    <button id="redSkin">Czerwony (500)</button>
    <button id="greenSkin">Zielony (500)</button>
    <button id="blueSkin">Niebieski (500)</button>
    <button id="yellowSkin">Żółty (1000)</button>
</div>

<div>
    <h2>Skrzynki</h2>
    <button id="chestBtn">Skrzynka</button>
</div>

<div id="inventoryPanel">
    <h3>Ekwipunek</h3>
    <div id="inventory"></div>
    <p>Max 2 aktywne itemy</p>
</div>

<script type="module" src="./ui.js"></script>

</body>
</html>
